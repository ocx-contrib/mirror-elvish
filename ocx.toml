#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain for the mirror-elvish sibling repo.
#
# `uv` is the generator runtime: Elvish ships its binaries on the dl.elv.sh
# CDN rather than as GitHub release assets, so this is a `url_index` mirror
# whose `generator.command` is `["uv", "run", "scripts/generate.py"]`. Without
# `uv` on PATH, discover dies before it reads a single release.
#
# The namespaced `ocx.sh/astral-sh/uv` (published by ocx-contrib/mirror-astral-sh)
# — never the flat `ocx.sh/uv`, which dies with the ocx.sh host.

[tools]
cli = "ocx.sh/ocx/cli:0.6"
mirror = "ocx.sh/ocx/mirror:0.6"
uv = "ocx.sh/astral-sh/uv:0"
